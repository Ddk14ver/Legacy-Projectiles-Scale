plugins {
    // MC 26.2 requires the 1.17 snapshot line (stable 1.17.19 predates unobfuscated
    // support); the dynamic 1.17-SNAPSHOT does not resolve from fabric's maven, so use
    // the pinned timestamped snapshot that the official template points to.
    id 'fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

// Jar names carry the Minecraft version suffix, e.g. legacy-projectiles-scale-1.0.0-26.2.jar,
// so builds for different MC versions are never confused (the version also lands in
// fabric.mod.json).
version = "${project.mod_version}-${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Cloth Config (configuration GUI library)
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me'
    }
    // Mod Menu (configuration screen entry)
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases'
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // MC 26.1+ is unobfuscated (official Mojang names, with parameter names), so NO
    // mappings declaration is needed - Yarn was discontinued after 1.21.11. Mods are
    // declared with plain `implementation` (no remapping involved) per the official
    // fabric-example-mod 26.2 template.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Configuration GUI: Cloth Config + Mod Menu
    implementation "me.shedaniel.cloth:cloth-config-fabric:26.2.155"
    implementation "com.terraformersmc:modmenu:20.0.1"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    // MC 26.2 ecosystem (cloth-config, modmenu) is built for JVM 25
    it.options.release = 25
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

// Configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}
