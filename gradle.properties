# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric (https://meta.fabricmc.net)
# MC 26.1+ is unobfuscated - no mappings needed (Yarn discontinued after 1.21.11).
minecraft_version=26.2
loader_version=0.19.3
# Loom: switch off the obfuscation/mappings pipeline (26.1+ ships unobfuscated code).
fabric.loom.disableObfuscation=true

# Mod
mod_version=1.0.0
maven_group=com.legacyprojectiles
archives_base_name=legacy-projectiles-scale
